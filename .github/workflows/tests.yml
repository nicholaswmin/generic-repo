name: tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node-version: [lts/*]
    env:
      ENV_CI: 1
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        persist-credentials: false
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - run: npm ci
    - run: npm test
      env:
        NODE_ENV: test

  publish-check:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      published: ${{ steps.version.outputs.published }}
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        persist-credentials: false
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: lts/*
    - id: version
      run: |
        version="$(node -p "require('./package.json').version")"
        if npm view "generic-repo@${version}" version >/dev/null 2>&1; then
          echo "published=true" >> "$GITHUB_OUTPUT"
        else
          echo "published=false" >> "$GITHUB_OUTPUT"
        fi

  publish:
    needs: publish-check
    if: needs.publish-check.outputs.published == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        persist-credentials: false
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: lts/*
        cache: npm
        registry-url: https://registry.npmjs.org
    - run: npm ci
    - run: npm install -g npm@11.14.1
    - run: npm publish --provenance --access public
